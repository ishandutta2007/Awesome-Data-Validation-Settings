<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 340"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="primary-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="accent-cyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".8"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="soft-blur" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur stdDeviation="16"/></filter></defs><style>.subtitle-text,.tag-text,.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:44px;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-weight:500;font-size:19px;fill:#94a3b8}.tag-text{font-weight:600;font-size:13px;fill:#e2e8f0}.code-text{font-family:&apos;Fira Code&apos;,&apos;JetBrains Mono&apos;,Consolas,monospace;font-size:13px;fill:#38bdf8}</style><rect width="1200" height="340" fill="url(#bg-grad)" rx="16"/><rect width="1196" height="336" x="2" y="2" fill="none" stroke="#1e293b" stroke-width="2" rx="14"/><g opacity=".35" style="mix-blend-mode:screen"><circle cx="200" cy="80" r="130" fill="#3b82f6" filter="url(#soft-blur)"><animate attributeName="cx" dur="12s" repeatCount="indefinite" values="180;230;180"/><animate attributeName="cy" dur="9s" repeatCount="indefinite" values="70;110;70"/></circle><circle cx="1020" cy="240" r="140" fill="#8b5cf6" filter="url(#soft-blur)"><animate attributeName="cx" dur="14s" repeatCount="indefinite" values="1020;970;1020"/><animate attributeName="cy" dur="10s" repeatCount="indefinite" values="240;200;240"/></circle><circle cx="650" cy="280" r="110" fill="#ec4899" filter="url(#soft-blur)"><animate attributeName="r" dur="8s" repeatCount="indefinite" values="100;125;100"/><animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0.25;0.45;0.25"/></circle></g><g opacity=".2"><path fill="none" stroke="#3b82f6" stroke-dasharray="6 6" stroke-width="1.5" d="M 0,90 Q 300,120 600,80 T 1200,90"><animate attributeName="stroke-dashoffset" dur="15s" repeatCount="indefinite" values="0;-120"/></path><path fill="none" stroke="#8b5cf6" stroke-dasharray="8 6" stroke-width="1.5" d="M 0,250 Q 350,210 700,260 T 1200,230"><animate attributeName="stroke-dashoffset" dur="18s" repeatCount="indefinite" values="0;140"/></path></g><g opacity=".85"><circle cx="1060" cy="80" r="6" fill="#38bdf8" filter="url(#glow)"><animate attributeName="r" dur="3s" repeatCount="indefinite" values="5;7;5"/><animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0.6;1;0.6"/></circle><circle cx="1060" cy="80" r="15" fill="none" stroke="#38bdf8" stroke-width="1" opacity=".4"><animate attributeName="r" dur="3s" repeatCount="indefinite" values="10;22;10"/><animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0.6;0;0.6"/></circle><circle cx="1120" cy="150" r="5" fill="#a855f7" filter="url(#glow)"><animate attributeName="r" dur="2.5s" repeatCount="indefinite" values="4;6.5;4"/></circle><circle cx="1000" cy="180" r="5" fill="#ec4899" filter="url(#glow)"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.4;0.9;0.4"/></circle></g><g transform="translate(80, 48)"><rect width="215" height="28" fill="#1e293b" stroke="#334155" stroke-width="1" rx="14"/><circle cx="16" cy="14" r="4.5" fill="#22c55e"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="1;0.4;1"/></circle><text x="28" y="19" fill="#38bdf8" class="tag-text" font-size="12">DATA INTEGRITY ECOSYSTEM</text></g><rect width="90" height="4" x="80" y="88" fill="url(#primary-glow)" rx="2"/><text x="80" y="142" class="title-text">Awesome Data Validation &amp; Settings</text><text x="80" y="180" class="subtitle-text">Curated schema enforcement, strict type parsing, configuration engines &amp; cloud registries</text><g><g transform="translate(80, 222) translate(0, 0)"><rect width="180" height="40" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" rx="10"/><circle cx="20" cy="20" r="5" fill="#38bdf8"/><text x="34" y="25" class="tag-text">Schema Enforcement</text></g><g transform="translate(80, 222) translate(194, 0)"><rect width="180" height="40" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" rx="10"/><circle cx="20" cy="20" r="5" fill="#a855f7"/><text x="34" y="25" class="tag-text">Type-Safe Parsing</text></g><g transform="translate(80, 222) translate(388, 0)"><rect width="180" height="40" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" rx="10"/><circle cx="20" cy="20" r="5" fill="#ec4899"/><text x="34" y="25" class="tag-text">Hierarchical Settings</text></g><g transform="translate(80, 222) translate(582, 0)"><rect width="195" height="40" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" rx="10"/><circle cx="20" cy="20" r="5" fill="#10b981"/><text x="34" y="25" class="tag-text">Stream Governance</text></g></g><g transform="translate(890, 80)"><rect width="230" height="185" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" rx="12"/><circle cx="18" cy="18" r="4.5" fill="#ef4444"/><circle cx="32" cy="18" r="4.5" fill="#f59e0b"/><circle cx="46" cy="18" r="4.5" fill="#10b981"/><line x1="10" x2="220" y1="32" y2="32" stroke="#1e293b" stroke-width="1"/><text x="18" y="58" fill="#64748b" class="code-text"># Validated Model</text><text x="18" y="80" fill="#f43f5e" class="code-text">class</text><text x="64" y="80" fill="#e2e8f0" class="code-text">Config</text><text x="114" y="80" fill="#94a3b8" class="code-text">(BaseModel):</text><text x="30" y="104" fill="#93c5fd" class="code-text">db_host</text><text x="86" y="104" fill="#f43f5e" class="code-text">:</text><text x="100" y="104" fill="#38bdf8" class="code-text">str</text><text x="30" y="126" fill="#93c5fd" class="code-text">timeout</text><text x="86" y="126" fill="#f43f5e" class="code-text">:</text><text x="100" y="126" fill="#f59e0b" class="code-text">PositiveInt</text><text x="30" y="148" fill="#93c5fd" class="code-text">strict</text><text x="76" y="148" fill="#f43f5e" class="code-text">:</text><text x="90" y="148" fill="#10b981" class="code-text">bool = True</text><g transform="translate(182, 142)"><circle cx="14" cy="14" r="14" fill="#10b981" opacity=".2"><animate attributeName="r" dur="2s" repeatCount="indefinite" values="12;16;12"/></circle><circle cx="14" cy="14" r="10" fill="#10b981"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M 10,14 L 13,17 L 19,10"/></g></g><rect width="1200" height="4" x="0" y="336" fill="url(#primary-glow)"/></svg>