<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .tag-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .code-text {
      font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace;
      font-size: 13px;
      fill: #38bdf8;
    }
  </style>

  <!-- Deep Base Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)" />
  <rect width="1196" height="336" x="2" y="2" rx="14" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- DYNAMIC AMBIENT BACKGROUND GLOWS (Subtle floating light orbs) -->
  <g opacity="0.35" style="mix-blend-mode: screen;">
    <circle cx="200" cy="80" r="130" fill="#3b82f6" filter="url(#soft-blur)">
      <animate attributeName="cx" values="180;230;180" dur="12s" repeatCount="indefinite" />
      <animate attributeName="cy" values="70;110;70" dur="9s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="240" r="140" fill="#8b5cf6" filter="url(#soft-blur)">
      <animate attributeName="cx" values="1020;970;1020" dur="14s" repeatCount="indefinite" />
      <animate attributeName="cy" values="240;200;240" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle cx="650" cy="280" r="110" fill="#ec4899" filter="url(#soft-blur)">
      <animate attributeName="r" values="100;125;100" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.25;0.45;0.25" dur="7s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- BACKGROUND DATA FLOW STREAM / GRID ACCENTS -->
  <g opacity="0.2">
    <path d="M 0,90 Q 300,120 600,80 T 1200,90" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="0;-120" dur="15s" repeatCount="indefinite" />
    </path>
    <path d="M 0,250 Q 350,210 700,260 T 1200,230" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="8,6">
      <animate attributeName="stroke-dashoffset" values="0;140" dur="18s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- FLOATING DATA FLOW NODES / PULSING PACKETS (Controlled Background Placement) -->
  <g opacity="0.85">
    <!-- Stream Node 1 -->
    <circle cx="1060" cy="80" r="6" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="r" values="5;7;5" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="1060" cy="80" r="15" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="10;22;10" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite" />
    </circle>

    <!-- Stream Node 2 -->
    <circle cx="1120" cy="150" r="5" fill="#a855f7" filter="url(#glow)">
      <animate attributeName="r" values="4;6.5;4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    
    <!-- Stream Node 3 -->
    <circle cx="1000" cy="180" r="5" fill="#ec4899" filter="url(#glow)">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- FOREGROUND: HEADER BADGE / STATUS CHIP -->
  <g transform="translate(80, 48)">
    <rect width="215" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="19" class="tag-text" font-size="12" fill="#38bdf8">DATA INTEGRITY ECOSYSTEM</text>
  </g>

  <!-- FOREGROUND: TITLE & SUBTITLE (Always Crisply Legible) -->
  <!-- Top decorative gradient line -->
  <rect x="80" y="88" width="90" height="4" rx="2" fill="url(#primary-glow)" />

  <text x="80" y="142" class="title-text">Awesome Data Validation &amp; Settings</text>
  <text x="80" y="180" class="subtitle-text">Curated schema enforcement, strict type parsing, configuration engines &amp; cloud registries</text>

  <!-- FOREGROUND: FEATURE PILLS (Static, high-contrast, clean) -->
  <g transform="translate(80, 222)">
    <!-- Pill 1: Schema Enforcement -->
    <g transform="translate(0, 0)">
      <rect width="180" height="40" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="20" cy="20" r="5" fill="#38bdf8" />
      <text x="34" y="25" class="tag-text">Schema Enforcement</text>
    </g>

    <!-- Pill 2: Type Hints & Rust Core -->
    <g transform="translate(194, 0)">
      <rect width="180" height="40" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="20" cy="20" r="5" fill="#a855f7" />
      <text x="34" y="25" class="tag-text">Type-Safe Parsing</text>
    </g>

    <!-- Pill 3: Settings & Config -->
    <g transform="translate(388, 0)">
      <rect width="180" height="40" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="20" cy="20" r="5" fill="#ec4899" />
      <text x="34" y="25" class="tag-text">Hierarchical Settings</text>
    </g>

    <!-- Pill 4: Cloud Schema Governance -->
    <g transform="translate(582, 0)">
      <rect width="195" height="40" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="20" cy="20" r="5" fill="#10b981" />
      <text x="34" y="25" class="tag-text">Stream Governance</text>
    </g>
  </g>

  <!-- FOREGROUND RIGHT SIDE: VALIDATION CODE / SYNTAX CARD (Subtle preview) -->
  <g transform="translate(890, 80)">
    <rect width="230" height="185" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <!-- Window controls -->
    <circle cx="18" cy="18" r="4.5" fill="#ef4444" />
    <circle cx="32" cy="18" r="4.5" fill="#f59e0b" />
    <circle cx="46" cy="18" r="4.5" fill="#10b981" />
    <line x1="10" y1="32" x2="220" y2="32" stroke="#1e293b" stroke-width="1" />

    <!-- Code Mockup -->
    <text x="18" y="58" class="code-text" fill="#64748b"># Validated Model</text>
    <text x="18" y="80" class="code-text" fill="#f43f5e">class </text><text x="64" y="80" class="code-text" fill="#e2e8f0">Config</text><text x="114" y="80" class="code-text" fill="#94a3b8">(BaseModel):</text>
    <text x="30" y="104" class="code-text" fill="#93c5fd">db_host</text><text x="86" y="104" class="code-text" fill="#f43f5e">: </text><text x="100" y="104" class="code-text" fill="#38bdf8">str</text>
    <text x="30" y="126" class="code-text" fill="#93c5fd">timeout</text><text x="86" y="126" class="code-text" fill="#f43f5e">: </text><text x="100" y="126" class="code-text" fill="#f59e0b">PositiveInt</text>
    <text x="30" y="148" class="code-text" fill="#93c5fd">strict</text><text x="76" y="148" class="code-text" fill="#f43f5e">: </text><text x="90" y="148" class="code-text" fill="#10b981">bool = True</text>

    <!-- Animated Checkmark badge on card -->
    <g transform="translate(182, 142)">
      <circle cx="14" cy="14" r="14" fill="#10b981" opacity="0.2">
        <animate attributeName="r" values="12;16;12" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="14" cy="14" r="10" fill="#10b981" />
      <path d="M 10,14 L 13,17 L 19,10" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="336" width="1200" height="4" fill="url(#primary-glow)" />
</svg>
